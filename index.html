<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PharmaLink</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
  <link rel="icon" href="assets/brand/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon.png" />
  <script>
    (function () {
      try {
        var session = JSON.parse(localStorage.getItem('pharmalink_session') || 'null');
        if (session && session.role) {
          var map = {
            platform_admin: 'admin/dashboard.html',
            supplier_owner: 'supplier/dashboard.html',
            supplier_sales: 'supplier/dashboard.html'
          };
          location.replace(map[session.role] || 'buyer/dashboard.html');
          return;
        }
      } catch (e) {}
      location.replace('login.html');
    })();
  </script>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;margin-top:40px">Loading PharmaLink…</p>
</body>
</html>
