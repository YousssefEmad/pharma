<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>اختيار المؤسسة | PharmaLink</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
  <link rel="icon" href="assets/brand/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="assets/css/design-tokens.css" rel="stylesheet" />
  <link href="assets/css/typography.css" rel="stylesheet" />
  <link href="assets/css/layout.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
  <link href="assets/css/responsive.css" rel="stylesheet" />
  <link href="assets/css/rtl.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.min.css" rel="stylesheet" />
</head>
<body style="background:var(--pl-bg)">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <div class="pl-logo-lockup mb-2">
          <img class="pl-logo-mark" src="assets/brand/pharmalink-mark.png" alt="PharmaLink" width="40" height="40" decoding="async" />
          <span class="fw-bold" style="color:var(--pl-brand-navy)" data-i18n="appName">PharmaLink</span>
        </div>
        <a href="demo-accounts.html" class="small text-muted" data-i18n="back"></a>
        <h1 class="h3 fw-bold mt-2" data-i18n="orgSelectTitle"></h1>
      </div>
      <button type="button" class="btn btn-sm btn-pl-outline" data-toggle-lang>EN / ع</button>
    </div>
    <div class="row g-3" id="orgs"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/translations.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/utils/formatters.js"></script>
  <script src="assets/js/permissions.js"></script>
  <script src="assets/js/services/data-access.js"></script>
  <script src="assets/js/services/product-service.js"></script>
  <script src="assets/js/services/inventory-service.js"></script>
  <script src="assets/js/services/allocation-service.js"></script>
  <script src="assets/js/services/procurement-service.js"></script>
  <script src="assets/js/components/ui.js"></script>
  <script src="assets/js/components/chart-theme.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    PharmaApp.initAuthPage();
    var data = StorageService.ensureInitialized();
    var root = document.getElementById('orgs');
    data.organizations.filter(function (o) { return o.type !== 'platform'; }).forEach(function (o) {
      var user = data.users.find(function (u) { return u.orgId === o.id; });
      var col = document.createElement('div');
      col.className = 'col-md-6 col-lg-4';
      col.innerHTML = '<div class="pl-card h-100"><div class="pl-card-body">' +
        '<div class="fw-bold mb-1">' + escapeHtml(UI.orgLabel(o)) + '</div>' +
        '<div class="small text-muted mb-2">' + escapeHtml(o.city) + ' · ' + escapeHtml(o.type) + '</div>' +
        Formatters.statusBadge(o.status) +
        (user ? '<button type="button" class="btn btn-pl-primary btn-sm w-100 mt-3" data-uid="' + user.id + '">' + escapeHtml(t('continueAs')) + ' ' + escapeHtml(StorageService.getLang()==='ar'?user.nameAr:user.nameEn) + '</button>' : '<div class="small text-muted mt-3">—</div>') +
        '</div></div>';
      root.appendChild(col);
    });
    root.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-uid]');
      if (!btn) return;
      var session = Auth.loginAsUser(btn.getAttribute('data-uid'));
      location.href = PermissionService.dashboardPath(session.role).replace(/^\//, '');
    });
  </script>
</body>
</html>
