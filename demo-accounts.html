<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>حسابات تجريبية | PharmaLink</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
  <link rel="icon" href="assets/brand/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.min.css" rel="stylesheet" />
  <link href="assets/css/design-tokens.css" rel="stylesheet" />
  <link href="assets/css/typography.css" rel="stylesheet" />
  <link href="assets/css/layout.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
  <link href="assets/css/components.css" rel="stylesheet" />
  <link href="assets/css/responsive.css" rel="stylesheet" />
  <link href="assets/css/rtl.css" rel="stylesheet" />
</head>
<body style="background:var(--pl-bg)">
  <div class="container py-4 py-md-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <div class="pl-logo-lockup mb-2">
          <img class="pl-logo-mark" src="assets/brand/pharmalink-mark.png" alt="PharmaLink" width="40" height="40" decoding="async" />
          <span class="fw-bold" style="color:var(--pl-brand-navy)" data-i18n="appName">PharmaLink</span>
        </div>
        <a href="login.html" class="small text-muted"><i class="bi bi-arrow-right"></i> <span data-i18n="backToLogin">العودة</span></a>
        <h1 class="h3 fw-bold text-primary-pl mt-2 mb-1" data-i18n="demoAccountsTitle">اختر حساب العرض</h1>
        <p class="text-muted mb-0" data-i18n="demoAccountsDesc">اختر دوراً لاستكشاف المنصة</p>
      </div>
      <button type="button" class="btn btn-sm btn-pl-outline" data-toggle-lang>EN / ع</button>
    </div>
    <div class="alert alert-warning border-0 small" data-i18n="demoNote"></div>
    <div class="row g-3" id="accountsGrid"></div>
    <div class="mt-4 text-center">
      <a href="organization-select.html" class="btn btn-pl-outline" data-i18n="selectOrg">اختر المؤسسة</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/translations.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/utils/formatters.js"></script>
  <script src="assets/js/permissions.js"></script>
  <script src="assets/js/services/data-access.js"></script>
  <script src="assets/js/services/product-service.js"></script>
  <script src="assets/js/services/inventory-service.js"></script>
  <script src="assets/js/services/allocation-service.js"></script>
  <script src="assets/js/services/procurement-service.js"></script>
  <script src="assets/js/components/ui.js"></script>
  <script src="assets/js/components/chart-theme.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    PharmaApp.initAuthPage();
    var data = StorageService.ensureInitialized();
    var demoUsers = [
      'USR-ADM','USR-BO1','USR-BP1','USR-BV1','USR-SO1','USR-SS1'
    ];
    var grid = document.getElementById('accountsGrid');
    demoUsers.forEach(function (id) {
      var u = data.users.find(function (x) { return x.id === id; });
      if (!u) return;
      var org = data.organizations.find(function (o) { return o.id === u.orgId; });
      var col = document.createElement('div');
      col.className = 'col-md-6 col-lg-4';
      var name = StorageService.getLang() === 'ar' ? u.nameAr : u.nameEn;
      var orgName = org ? (StorageService.getLang() === 'ar' ? org.nameAr : org.nameEn) : '';
      col.innerHTML = '<div class="pl-demo-account" data-user="' + u.id + '">' +
        '<div class="d-flex justify-content-between align-items-start mb-2">' +
        '<span class="pl-badge badge-teal">' + escapeHtml(t('role_' + u.role)) + '</span>' +
        '<i class="bi bi-box-arrow-in-left text-muted"></i></div>' +
        '<div class="role">' + escapeHtml(name) + '</div>' +
        '<div class="meta">' + escapeHtml(orgName) + '</div>' +
        '<div class="meta mt-1"><code class="small">' + escapeHtml(u.email) + '</code></div>' +
        '<button type="button" class="btn btn-pl-primary btn-sm w-100 mt-3">' + escapeHtml(t('enterSystem')) + '</button>' +
        '</div>';
      grid.appendChild(col);
    });
    grid.addEventListener('click', function (e) {
      var card = e.target.closest('[data-user]');
      if (!card) return;
      var session = Auth.loginAsUser(card.getAttribute('data-user'));
      if (!session) return;
      UI.toast(t('loginSuccess'));
      setTimeout(function () {
        location.href = PermissionService.dashboardPath(session.role).replace(/^\//, '');
      }, 300);
    });
  </script>
</body>
</html>
